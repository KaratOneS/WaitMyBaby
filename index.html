<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Обратный отсчёт</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background: #ffffff;
            color: #111111;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 30px;
        }

        .timer {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .item {
            min-width: 70px;
        }

        .number {
            font-size: 40px;
            font-weight: bold;
        }

        .label {
            margin-top: 5px;
            font-size: 14px;
            color: #777777;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>До 14 октября осталось</h1>

    <div class="timer">
        <div class="item">
            <div class="number" id="days">00</div>
            <div class="label">дней</div>
        </div>

        <div class="item">
            <div class="number" id="hours">00</div>
            <div class="label">часов</div>
        </div>

        <div class="item">
            <div class="number" id="minutes">00</div>
            <div class="label">минут</div>
        </div>

        <div class="item">
            <div class="number" id="seconds">00</div>
            <div class="label">секунд</div>
        </div>
    </div>
</div>

<script>
    // Дата окончания:
    const targetDate = new Date("2026-10-14T13:00:00");

    function updateTimer() {
        const now = new Date();
        const difference = targetDate - now;

        if (difference <= 0) {
            document.getElementById("days").textContent = "00";
            document.getElementById("hours").textContent = "00";
            document.getElementById("minutes").textContent = "00";
            document.getElementById("seconds").textContent = "00";
            return;
        }

        const days = Math.floor(difference / (1000 * 60 * 60 * 24));
        const hours = Math.floor(
            (difference / (1000 * 60 * 60)) % 24
        );
        const minutes = Math.floor(
            (difference / (1000 * 60)) % 60
        );
        const seconds = Math.floor(
            (difference / 1000) % 60
        );

        document.getElementById("days").textContent =
            String(days).padStart(2, "0");

        document.getElementById("hours").textContent =
            String(hours).padStart(2, "0");

        document.getElementById("minutes").textContent =
            String(minutes).padStart(2, "0");

        document.getElementById("seconds").textContent =
            String(seconds).padStart(2, "0");
    }

    updateTimer();
    setInterval(updateTimer, 1000);
</script>

</body>
</html>
